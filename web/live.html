    <div class="live-actions">
      <a class="pill primary" href="/">改用一般版練習</a>
      <a class="pill" href="/live">再試一次</a>
    </div>
    <p class="muted login-foot">一般版隨時都能用；真人版開好後，這個網址會直接進去。</p>
  </div>
